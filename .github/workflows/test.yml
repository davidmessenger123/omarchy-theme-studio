# QML lint is deliberately not run here: it needs Quickshell's module set,
# which the runner does not provide, and qmllint reports the same
# unresolved-import warnings for a correct file as for a broken one. Check
# it locally instead:
#
#   /usr/lib/qt6/bin/qmllint -I /usr/share/omarchy/shell ThemeStudio.qml
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile omarchy-theme-from-image
      - name: Python unit tests
        run: python3 -m unittest discover -s tests
      - name: Plugin manifest is well formed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          assert manifest["id"] == "davidjm.theme-studio", manifest["id"]
          assert manifest["kinds"] == ["overlay"], manifest["kinds"]
          entry = manifest["entryPoints"]["overlay"]
          assert Path(entry).is_file(), entry
          print("manifest ok:", manifest["name"], manifest["version"])
          PY
